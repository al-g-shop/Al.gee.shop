<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 알지언니Live 🌸 주문 조회</title>
  <style>
    :root { 
      --primary: #ff4d6d; 
      --primary-hover: #e03152;
      --bg: #fff0f3; 
      --card-bg: #fff; 
      --text: #2b2b2b; 
      --border: #ffccd5; 
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); font-size: 18px; }
    .container { max-width: 600px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
    .header h1 { font-size: 26px; margin: 0; color: var(--primary); font-weight: 900; letter-spacing: -0.5px; }
    .header a { text-decoration: none; font-size: 16px; font-weight: bold; color: #d63384; background: #fff; padding: 12px 20px; border-radius: 25px; box-shadow: 0 2px 6px rgba(255, 77, 109, 0.15); border: 1px solid var(--border); }

    .card { background: var(--card-bg); padding: 28px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
    h2 { font-size: 22px; margin-top: 0; margin-bottom: 14px; color: #111; display: flex; align-items: center; gap: 8px; font-weight: 800; }
    p { font-size: 17px; color: #444; line-height: 1.6; margin-top: 0; }
    
    input { width: 100%; padding: 18px; margin-bottom: 14px; border: 2px solid #ffd1d8; border-radius: 14px; box-sizing: border-box; font-size: 18px; background: #fff; color: #333; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.15); }
    
    button { padding: 18px 20px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 18px; width: 100%; }
    button:hover { background: var(--primary-hover); }

    .order-item { background: #fff5f7; border: 2px solid #ffccd5; border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 17px; color: var(--primary); margin-bottom: 12px; border-bottom: 1px dashed #ffb3c6; padding-bottom: 10px; }
    .order-info { font-size: 16px; color: #333; line-height: 1.7; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; background: #ffe3e8; color: #c9184a; margin-top: 10px; }
    .status-badge.paid { background: #d8f5a2; color: #2b8a3e; }
    
    /* 📦 로젠택배 배송조회 버튼 디자인 스타일 */
    .tracking-btn { display: inline-block; margin-top: 12px; background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: bold; }
    .tracking-btn:hover { background: #555; }

    #loadingModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
    .loading-content { background: #fff; padding: 35px; border-radius: 20px; text-align: center; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🌸 알지언니Live 🌸</h1>
      <a href="index.html">✍️ 주문서 작성하기</a>
    </div>

    <div class="card">
      <h2>🔍 주문 내역 조회</h2>
      <p>주문하실 때 입력하셨던 <b>연락처</b>를 입력해 주세요.</p>
      <input type="tel" id="searchPhone" placeholder="연락처 (예: 01012345678 또는 하이픈 포함)">
      <button onclick="searchOrders()">조회하기</button>
    </div>

    <div id="resultContainer"></div>
  </div>

  <div id="loadingModal">
    <div class="loading-content">
      <h3 style="margin-top:0; color:var(--primary); font-size:20px;">조회 중...</h3>
      <p style="margin-bottom:0; font-size:16px; color:#666;">주문 내역을 찾고 있습니다.</p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQ0KIkw3m63VUEyAq1OFXisjXfkT1S7zozn1TlvlwK317Pn35hdcfo3AwcxvQtZIrbJQ/exec";

    async function searchOrders() {
      const phone = document.getElementById('searchPhone').value.trim();
      if (!phone) return alert('연락처를 입력해주세요.');

      document.getElementById('loadingModal').style.display = 'flex';

      try {
        const res = await fetch(`${API_URL}?action=getOrders&phone=${encodeURIComponent(phone)}`);
        const orders = await res.json();
        document.getElementById('loadingModal').style.display = 'none';

        const container = document.getElementById('resultContainer');
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
          container.innerHTML = `<div class="card" style="text-align:center; color:#777; padding:35px; font-size:17px;">일치하는 주문 내역이 없습니다.</div>`;
          return;
        }

        orders.forEach(order => {
          let dateStr = "";
          if (order.date) {
            const d = new Date(order.date);
            dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          }

          const statusClass = order.isPaid ? 'paid' : '';
          const statusText = order.isPaid ? '✅ 입금 확인 완료' : '⏳ 입금 대기 중';
          
          // 💡 L열에 송장번호가 있고 '합배송'이 아닐 경우 로젠택배 배송조회 버튼 자동 생성
          let trackingStr = "";
          if (order.trackingNo && String(order.trackingNo).trim() !== "" && !String(order.trackingNo).includes("합배송")) {
            const cleanTrackingNo = String(order.trackingNo).trim();
            trackingStr = `<br><b>택배 송장번호:</b> ${cleanTrackingNo} 
                           <br><a href="https://www.ilogen.com/web/personal/trace/${cleanTrackingNo}" target="_blank" class="tracking-btn">📦 로젠택배 배송조회</a>`;
          } else if (order.trackingNo) {
            trackingStr = `<br><b>택배 송장번호:</b> ${order.trackingNo}`;
          }

          container.innerHTML += `
            <div class="order-item">
              <div class="order-header">
                <span>주문번호: ${order.orderNo}</span>
                <span>${dateStr}</span>
              </div>
              <div class="order-info">
                <b>수령인:</b> ${order.recipient}<br>
                <b>주문 상품:</b> ${order.items}<br>
                <b>총 결제금액:</b> <span style="color:var(--primary); font-weight:bold; font-size:18px;">${Number(order.totalPrice).toLocaleString()}원</span>
                ${trackingStr}
                <div><span class="status-badge ${statusClass}">${statusText}</span></div>
              </div>
            </div>
          `;
        });

      } catch (e) {
        document.getElementById('loadingModal').style.display = 'none';
        alert('조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        console.error(e);
      }
    }
  </script>
</body>
</html>
