<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ 알지언니Live ❤️ - 주문서</title>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    :root {
      --primary-color: #e63946;
      --primary-hover: #c5283d;
      --bg-color: #f8f9fa;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --border-color: #E1E6EB;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
    .container { max-width: 520px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    h1 { color: var(--primary-color); font-size: 20px; margin: 0; font-weight: 800; }
    .header a { text-decoration: none; font-size: 13px; font-weight: bold; color: #555; background: #f1f3f5; padding: 6px 12px; border-radius: 20px; }

    .section { margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
    label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #444; }
    input[type="text"], input[type="tel"], select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; font-size: 14px; box-sizing: border-box; }
    
    .btn { background: #222; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; }
    .btn:hover { background: #000; }
    .btn-secondary { background: #6c757d; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #ddd; font-size: 14px; }
    .cart-item-controls { display: flex; align-items: center; gap: 6px; }
    .cart-item-controls button { width: 26px; height: 26px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }
    
    .total-price { font-size: 17px; font-weight: bold; text-align: right; color: var(--primary-color); margin-top: 15px; }
    .flex-row { display: flex; gap: 6px; }
    .flex-row input { flex: 1; }
    .flex-row button { width: auto; white-space: nowrap; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>❤️ 알지언니Live ❤️</h1>
    <a href="customer.html">주문조회하기 →</a>
  </div>

  <!-- 1. 댓글로 주문 불러오기 -->
  <div class="section">
    <label for="searchNickname">라이브 방송 닉네임으로 주문 불러오기</label>
    <div class="flex-row">
      <input type="text" id="searchNickname" placeholder="닉네임을 입력하세요">
      <button class="btn" onclick="fetchCommentOrder()" style="width: 80px;">조회</button>
    </div>
    <div id="commentResult" style="font-size:12px; color:#e63946; margin-top:4px; font-weight:bold;"></div>
  </div>

  <!-- 2. 직접 상품 추가 -->
  <div class="section">
    <label for="productSelect">상품 직접 선택하기</label>
    <div class="flex-row">
      <select id="productSelect">
        <option value="">상품을 선택하세요</option>
      </select>
      <button class="btn btn-secondary" onclick="addSelectedProduct()" style="width: 80px;">추가</button>
    </div>
  </div>

  <!-- 3. 장바구니 목록 -->
  <div class="section">
    <label>🛒 선택된 주문 상품 목록</label>
    <div id="cartList"><p style="color:#888; font-size:13px; text-align:center; margin:10px 0;">담긴 상품이 없습니다.</p></div>
    <div class="total-price" id="totalPrice">총 결제 금액: 0원</div>
  </div>

  <!-- 4. 배송지 및 주문자 정보 -->
  <form id="orderForm" onsubmit="submitOrder(event)">
    <div class="section">
      <label for="nickname">주문자 닉네임 (방송 닉네임)</label>
      <input type="text" id="nickname" placeholder="예: 알지러브" required>

      <label for="depositor">입금자명</label>
      <input type="text" id="depositor" placeholder="입금하시는 분 성함" required>

      <label for="recipient">수령인 성함</label>
      <input type="text" id="recipient" placeholder="받으시는 분 성함" required>

      <label for="phone">연락처</label>
      <input type="tel" id="phone" placeholder="010-0000-0000" required>

      <label>배송지 주소</label>
      <div class="flex-row">
        <input type="text" id="zipcode" placeholder="우편번호" readonly required>
        <button type="button" class="btn btn-secondary" onclick="execDaumPostcode()">주소 검색</button>
      </div>
      <input type="text" id="address1" placeholder="기본주소" readonly required>
      <input type="text" id="address2" placeholder="상세주소를 입력하세요" required>
    </div>

    <button type="submit" class="btn" id="submitBtn" style="background: var(--primary-color); padding: 14px; font-size: 16px;">주문 완료하기</button>
  </form>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxQ0KIkw3m63VUEyAq1OFXisjXfkT1S7zozn1TlvlwK317Pn35hdcfo3AwcxvQtZIrbJQ/exec";
  let productCatalog = [];
  let cart = {};

  window.onload = async function() {
    await loadProducts();
    loadSavedAddress();
  };

  async function loadProducts() {
    try {
      const res = await fetch(`${GAS_URL}?action=products`);
      const data = await res.json();
      productCatalog = data.products || [];
      const select = document.getElementById("productSelect");
      
      productCatalog.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.code;
        opt.textContent = `[${p.code}] ${p.name} - ${p.price.toLocaleString()}원`;
        select.appendChild(opt);
      });
    } catch (e) {
      alert("상품 목록을 불러오지 못했습니다.");
    }
  }

  async function fetchCommentOrder() {
    const nick = document.getElementById("searchNickname").value.trim();
    if (!nick) return alert("닉네임을 입력해주세요.");

    const resultDiv = document.getElementById("commentResult");
    resultDiv.textContent = "조회 중...";

    try {
      const res = await fetch(`${GAS_URL}?nickname=${encodeURIComponent(nick)}`);
      const data = await res.json();
      
      if (!data.orders || data.orders.length === 0) {
        resultDiv.textContent = "해당 닉네임의 주문 댓글이 없습니다.";
        return;
      }

      resultDiv.textContent = `✨ ${nick}님의 댓글 주문을 불러왔습니다!`;
      document.getElementById("nickname").value = nick;

      cart = {};
      data.orders.forEach(ord => {
        const key = ord.code;
        cart[key] = (cart[key] || 0) + ord.qty;
      });
      renderCart();
    } catch(e) {
      resultDiv.textContent = "댓글 정보를 불러오는 중 오류가 발생했습니다.";
    }
  }

  function addSelectedProduct() {
    const pId = document.getElementById("productSelect").value;
    if (!pId) return alert("상품을 선택해주세요.");
    cart[pId] = (cart[pId] || 0) + 1;
    renderCart();
  }

  function updateQty(pId, delta) {
    if (cart[pId]) {
      cart[pId] += delta;
      if (cart[pId] <= 0) delete cart[pId];
    }
    renderCart();
  }

  function renderCart() {
    const cartList = document.getElementById("cartList");
    cartList.innerHTML = "";
    let total = 0;
    const keys = Object.keys(cart);

    if (keys.length === 0) {
      cartList.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; margin:10px 0;">담긴 상품이 없습니다.</p>';
      document.getElementById("totalPrice").textContent = "총 결제 금액: 0원";
      return;
    }

    keys.forEach(id => {
      const p = productCatalog.find(item => String(item.code) === String(id));
      if (p) {
        const subtotal = p.price * cart[id];
        total += subtotal;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <span>[${p.code}] ${p.name}</span>
          <div class="cart-item-controls">
            <button type="button" onclick="updateQty('${id}', -1)">-</button>
            <span>${cart[id]}</span>
            <button type="button" onclick="updateQty('${id}', 1)">+</button>
          </div>
        `;
        cartList.appendChild(div);
      }
    });

    document.getElementById("totalPrice").textContent = `총 결제 금액: ${total.toLocaleString()}원`;
  }

  function execDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        document.getElementById('zipcode').value = data.zonecode;
        document.getElementById('address1').value = data.address;
        document.getElementById('address2').focus();
      }
    }).open();
  }

  function loadSavedAddress() {
    const saved = JSON.parse(localStorage.getItem("algee_address") || "{}");
    if (saved.recipient) document.getElementById("recipient").value = saved.recipient;
    if (saved.phone) document.getElementById("phone").value = saved.phone;
    if (saved.zipcode) document.getElementById("zipcode").value = saved.zipcode;
    if (saved.address1) document.getElementById("address1").value = saved.address1;
    if (saved.address2) document.getElementById("address2").value = saved.address2;
  }

  async function submitOrder(e) {
    e.preventDefault();
    const keys = Object.keys(cart);
    if (keys.length === 0) return alert("상품을 하나 이상 선택해주세요.");

    let itemsList = [];
    let totalAmount = 0;
    
    keys.forEach(id => {
      const p = productCatalog.find(item => String(item.code) === String(id));
      if (p) {
        itemsList.push({
          code: p.code,
          name: p.name,
          color: "",
          size: "",
          price: p.price,
          qty: cart[id]
        });
        totalAmount += p.price * cart[id];
      }
    });

    const payload = {
      nickname: document.getElementById("nickname").value,
      depositor: document.getElementById("depositor").value,
      name: document.getElementById("recipient").value,
      phone: document.getElementById("phone").value,
      zipcode: document.getElementById("zipcode").value,
      address: document.getElementById("address1").value,
      detailAddress: document.getElementById("address2").value,
      items: itemsList,
      totalPrice: totalAmount
    };

    localStorage.setItem("algee_address", JSON.stringify({
      recipient: payload.name,
      phone: payload.phone,
      zipcode: payload.zipcode,
      address1: payload.address,
      address2: payload.detailAddress
    }));

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "주문 접수 중...";

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      
      if(result.success) {
        alert(`주문이 완료되었습니다! (주문번호: ${result.orderNo})`);
        location.reload();
      } else {
        throw new Error();
      }
    } catch(err) {
      alert("주문 접수 중 오류가 발생했습니다. 다시 시도해주세요.");
      submitBtn.disabled = false;
      submitBtn.textContent = "주문 완료하기";
    }
  }
</script>
</body>
</html>
