<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알지언니Live 주문서</title>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function searchAddress() {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById('zipcode').value = data.zonecode;
          document.getElementById('address').value = data.roadAddress || data.jibunAddress;
          document.getElementById('detailAddress').focus();
        }
      }).open();
    }
  </script>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    .card { max-width: 500px; margin: 0 auto 15px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .header-nav { max-width: 500px; margin: 0 auto 15px; display: flex; justify-content: space-between; align-items: center; }
    .header-nav a { text-decoration: none; color: #e63946; font-weight: bold; font-size: 14px; }
    h2 { font-size: 18px; margin-top: 0; color: #111; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    .row { display: flex; gap: 8px; }
    button { padding: 12px 16px; background: #222; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .item-box { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
    .total-box { font-size: 16px; font-weight: bold; text-align: right; margin-top: 15px; color: #e63946; }
    .bank-info { background: #fff5f5; border: 1px solid #feb2b2; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="header-nav">
    <span><b>알지언니</b> ♡ LIVE SHOPPING</span>
    <a href="customer.html">🔍 주문조회 하러가기 →</a>
  </div>

  <div class="card">
    <h2>1. 유튜브 닉네임 검색</h2>
    <div class="row">
      <input type="text" id="nickname" placeholder="댓글 쓴 닉네임 입력">
      <button onclick="fetchOrders()">불러오기</button>
    </div>
    <div id="orderList"><p style="color:#888; font-size:13px; margin:5px 0;">닉네임을 입력하고 불러오기를 눌러주세요.</p></div>
    <div class="total-box" id="priceSummary">총 결제금액: 0원</div>
  </div>

  <div class="card">
    <h2>2. 배송지 정보 입력</h2>
    <input type="text" id="name" placeholder="수령인 성함 (필수)">
    <input type="tel" id="phone" placeholder="연락처 숫자만 입력 (필수)">
    <div class="row">
      <input type="text" id="zipcode" placeholder="우편번호" readonly>
      <button type="button" onclick="searchAddress()">주소 검색</button>
    </div>
    <input type="text" id="address" placeholder="기본주소" readonly>
    <input type="text" id="detailAddress" placeholder="상세주소 입력 (동/호수)">

    <div class="bank-info">
      📌 <b>무통장 입금 안내</b><br>
      • 입금 계좌: <b>국민은행 487-10201-326715 (조일운)</b><br>
      • 주문자 성함과 입금자 성함이 같아야 자동 확인됩니다.
    </div>

    <button id="submitBtn" style="width:100%; background:#e63946; font-size:16px;" onclick="submitOrder()">주문서 제출하기</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxQ0KIkw3m63VUEyAq1OFXisjXfkT1S7zozn1TlvlwK317Pn35hdcfo3AwcxvQtZIrbJQ/exec";
    let currentItems = [];
    let totalAmount = 0;

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('savedAddress') || '{}');
      if (saved.name) {
        document.getElementById('name').value = saved.name;
        document.getElementById('phone').value = saved.phone;
        document.getElementById('zipcode').value = saved.zipcode;
        document.getElementById('address').value = saved.address;
        document.getElementById('detailAddress').value = saved.detailAddress;
      }
    };

    async function fetchOrders() {
      const nick = document.getElementById('nickname').value;
      if (!nick) return alert('닉네임을 입력해주세요.');
      
      const res = await fetch(`${API_URL}?nickname=${encodeURIComponent(nick)}`);
      const data = await res.json();
      currentItems = data.orders;
      renderOrders();
    }

    function renderOrders() {
      const listEl = document.getElementById('orderList');
      listEl.innerHTML = '';
      let itemTotal = 0;

      if(currentItems.length === 0) {
        listEl.innerHTML = '<p style="color:#e63946; font-size:13px;">불러온 상품이 없습니다. 닉네임과 댓글을 확인해주세요.</p>';
      }

      currentItems.forEach(item => {
        itemTotal += item.price * item.qty;
        let optStr = (item.color || item.size) ? ` (${[item.color, item.size].filter(Boolean).join('/')})` : '';
        listEl.innerHTML += `<div class="item-box">
          <span>[${item.code}] ${item.name}${optStr}</span>
          <b>${item.price.toLocaleString()}원</b>
        </div>`;
      });

      const shipping = itemTotal === 0 ? 0 : (itemTotal >= 200000 ? 0 : 4000);
      totalAmount = itemTotal + shipping;
      document.getElementById('priceSummary').innerText = 
        `상품금액 ${itemTotal.toLocaleString()}원 + 배송비 ${shipping.toLocaleString()}원 = 총 ${totalAmount.toLocaleString()}원`;
    }

    async function submitOrder() {
      if(currentItems.length === 0) return alert('주문할 상품을 먼저 불러와주세요.');
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const zipcode = document.getElementById('zipcode').value.trim();
      const detailAddress = document.getElementById('detailAddress').value.trim();

      if(!name) { alert('수령인 성함을 입력해주세요.'); document.getElementById('name').focus(); return; }
      if(!phone) { alert('연락처를 입력해주세요.'); document.getElementById('phone').focus(); return; }
      if(!zipcode) { alert('주소 검색을 통해 우편번호와 주소를 입력해주세요.'); return; }
      if(!detailAddress) { alert('상세주소(동/호수 등)를 입력해주세요.'); document.getElementById('detailAddress').focus(); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "주문 접수 중...";

      const payload = {
        nickname: document.getElementById('nickname').value,
        name: name,
        phone: phone,
        zipcode: zipcode,
        address: document.getElementById('address').value,
        detailAddress: detailAddress,
        items: currentItems,
        totalPrice: totalAmount
      };

      localStorage.setItem('savedAddress', JSON.stringify(payload));

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          alert(`🎉 주문이 정상 접수되었습니다!\n주문번호: ${result.orderNo}\n입금 후 배송이 시작됩니다. 감사합니다!`);
          location.reload();
        } else {
          alert('접수 중 오류가 발생했습니다. 다시 시도해 주세요.');
          btn.disabled = false;
          btn.innerText = "주문서 제출하기";
        }
      } catch (e) {
        alert('네트워크 오류가 발생했습니다.');
        btn.disabled = false;
        btn.innerText = "주문서 제출하기";
      }
    }
  </script>
</body>
</html>
